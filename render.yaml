services:
  - type: web
    name: edoc-lao-enterprise
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate --schema=server/prisma/schema.prisma && npm run build
    startCommand: npx prisma db push --schema=server/prisma/schema.prisma --accept-data-loss && node server/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: file:./server/prisma/dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: ./uploads
